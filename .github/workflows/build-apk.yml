# Builds a debug arm64 APK for the native-viewport experiment.
#
# This is a fork-only workflow: the upstream repository ships APKs from
# tooling/build-apk.sh by hand and does not accept external pull requests.
# It exists so a change can be tried on a second phone without a local
# Flutter + Android toolchain.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ego-native-view]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: Release arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Flutter dependencies and Android paths
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Analyze the files this branch touches
        working-directory: app
        run: |
          flutter analyze --no-pub lib/ui/chat/dsh_ui

      - name: Stage the runtime bundle from the matching official release
        run: |
          url="https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.1.0/dsh-go-1.1.0-arm64.apk"
          for attempt in 1 2 3 4 5; do
            if curl -fSL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/official.apk" "$url"; then
              break
            fi
            echo "retry $attempt"
            sleep 5
          done
          python3 tooling/stage_runtime_from_apk.py "$RUNNER_TEMP/official.apk" .

      - name: Build the release arm64 APK
        run: |
          CODE=$(python3 tooling/build_number.py)
          cd app
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name 1.1.0 --build-number "$CODE" \
            --dart-define=DSH_APP_VERSION="1.1.0+$CODE"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 7