# 构建带内置浏览器的 dsh-go APK。
#
# 手动触发：仓库页 → Actions → Build APK → Run workflow。
# 产物在本次运行的 Artifacts 里（dsh-go-apk-arm64）。
#
# 签名：仓库没有 key.properties 时，release 构建会自动回退到 debug 签名
# （见 app/android/app/build.gradle.kts 的 signingConfig）。想出自己的正式签名，
# 就在仓库 Secrets 里配好下面四个，workflow 会写 key.properties：
#   KEYSTORE_BASE64  keystore 文件的 base64（base64 -w0 release.jks）
#   KEYSTORE_FILE    keystore 在构建机上的文件名，比如 release.jks
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/lib/ui/web/**'
      - 'app/lib/ui/shell/**'
      - 'app/lib/state/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NDK_VERSION: 28.2.13676358
  TZ: Asia/Shanghai
  # 云端 runner 直连官方源更稳；本地构建时项目默认走阿里云镜像。
  DSH_MAVEN_MIRRORS: 0

jobs:
  apk:
    name: arm64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 固定签名：没有 key.properties 时 release 回退到 debug 签名，而 runner
      # 每次都是全新机器、默认 keystore 每个包都不同 → 装新版必须卸载、丢数据。
      # 仓库里带了一份公开的 debug keystore，这里铺到 AGP 找的位置。
      - name: Pin the signing key (so updates install over the old build)
        run: |
          mkdir -p "$HOME/.android"
          cp .github/dsh-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      # tawcroot 的 native 构建按版本号校验 NDK。
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # 可选：用自己的正式签名。没配 secret 时这步直接跳过，release 回退到 debug 签名。
      # （secrets 不能出现在 if 里，所以用环境变量判断。）
      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "没有配置 KEYSTORE_BASE64，用 debug 签名（release 构建自动回退）"
            exit 0
          fi
          file="${KEYSTORE_FILE:-release.jks}"
          echo "$KEYSTORE_BASE64" | base64 -d > "app/android/$file"
          {
            echo "storeFile=$file"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
          echo "已写入正式签名配置（$file）"

      - name: Flutter dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      # arb 是文案输入，app/lib/l10n/gen 是生成物（仓库里已提交）。加了新文案必须
      # 重新生成，否则 `l10n.browserTitle` 这类引用不存在，编译直接失败。
      - name: Generate l10n
        run: python3 app/tool/l10n_merge.py

      # Ubuntu base / Node / npm 包都下载到 runtime/.cache，命中后省 10 分钟。
      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/tawcroot/source.json') }}

      - name: Build Linux runtime (PRoot + Node + DSH)
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        run: bash tooling/build-apk.sh --release -f arm64

      # release 是 AOT：Dart 在 libapp.so 里，没有 kernel_blob。先上传再校验，
      # 校验写错了也不会把包卡在运行器上。
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify the APK carries the runtime and the browser
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -q 'assets/runtime/rootfs-arm64-v8a' \
            || { echo '缺 PRoot 运行时 — 运行时构建没进包'; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so' \
            || { echo '缺 libproot.so'; exit 1; }
          unzip -p "$APK" lib/arm64-v8a/libapp.so > /tmp/libapp.so
          # release 是 AOT：Dart 字符串在 libapp.so 里是 UTF-16LE，普通的
          # grep 中文（UTF-8）一定找不到，要用 Python 按 UTF-16 查。
          python3 - <<'PY'
          data = open('/tmp/libapp.so', 'rb').read()
          marks = ['输入网址或搜索内容', '新建标签页', '停止加载']
          missing = [m for m in marks if m.encode('utf-16-le') not in data]
          for m in marks:
              print(('MISS ' if m in missing else 'OK  找到浏览器文案: ') + m)
          if missing or b'BrowserPage' not in data:
              raise SystemExit('浏览器代码没进包')
          print('OK  BrowserPage 在 libapp.so 里')
          PY
          unzip -p "$APK" assets/runtime/manifest.json | head -c 200 > /dev/null
          echo "OK  运行时 manifest 可读"
          echo '=== 全部校验通过 ==='
          sha256sum "$APK"

